<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2 border-b border-gray-800 pb-6">
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-400 to-indigo-500 bg-clip-text text-transparent">
                ระบบช่วยคิดบทคลิปรีวิวสินค้า AI
            </h1>
            <p class="text-gray-400 text-sm md:text-base">ใส่ข้อมูลสินค้า รันบทรีวิวความยาวปังๆ แล้วส่งต่อไปทำคลิปวิดีโอได้ทันที</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Form Section -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-xl font-semibold text-purple-400 border-b border-gray-800 pb-2">1. กรอกข้อมูลสินค้า</h2>
                
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">ชื่อสินค้า *</label>
                    <input type="text" id="productName" placeholder="เช่น หูฟังไร้สาย Bluetooth 5.3" 
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">รายละเอียดสินค้า & จุดเด่น (ใส่ครบ 100%) *</label>
                    <textarea id="productDetails" rows="6" placeholder="เช่น เสียงเบสหนัก แน่น ตัดเสียงรบกวนได้ดี แบตอึด 40 ชั่วโมง กันน้ำ IPX5 ราคา 590 บาท..." 
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">อัปโหลดรูปภาพสินค้า</label>
                    <input type="file" id="productImage" accept="image/*" onchange="previewImg(event)"
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-400 file:mr-4 file:py-1 file:px-4 file:rounded-md file:border-0 file:bg-purple-600 file:text-white hover:file:bg-purple-700">
                    <div id="imagePreviewContainer" class="mt-3 hidden">
                        <img id="imagePreview" src="" alt="Preview" class="max-h-48 rounded-lg border border-gray-700 mx-auto object-cover">
                    </div>
                </div>

                <button onclick="generateScript()" id="genBtn"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg transition duration-200">
                    ✨ ให้ AI คิดคำพูดรีวิวขายของ
                </button>
            </div>

            <!-- Output Section -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-4">
                <div>
                    <h2 class="text-xl font-semibold text-purple-400 border-b border-gray-800 pb-2 mb-4">2. บทพูดรีวิวภาษาไทย (นำไปใส่ใน AI)</h2>
                    <div id="loading" class="hidden text-center py-8 text-purple-400 animate-pulse">
                        กำลังสร้างบทรีวิวสุดปังจากข้อมูล 100% ของคุณ...
                    </div>
                    <textarea id="outputScript" rows="12" readonly placeholder="ผลลัพธ์บทพูดรีวิวจะปรากฏที่นี่..." 
                        class="w-full bg-gray-950 border border-gray-800 rounded-lg p-4 text-gray-200 focus:outline-none leading-relaxed text-sm"></textarea>
                </div>

                <div class="space-y-3 pt-4 border-t border-gray-800">
                    <button onclick="copyToClipboard()" 
                        class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium py-2 rounded-lg transition text-sm flex items-center justify-center gap-2">
                        📋 คัดลอกบทพูดทั้งหมด
                    </button>
                    
                    <!-- Google Flow Link Button -->
                    <a href="https://labs.google/fx/th/tools/flow/project/07d6bba7-1f6c-48ae-93e2-c5a83d10c538" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       class="w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 text-center flex items-center justify-center gap-2">
                        🚀 สร้างคลิปด้วย google Flow
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // พรีวิวรูปภาพ
        function previewImg(event) {
            const container = document.getElementById('imagePreviewContainer');
            const img = document.getElementById('imagePreview');
            const file = event.target.files[0];
            if (file) {
                img.src = URL.createObjectURL(file);
                container.classList.remove('hidden');
            }
        }

        // คัดลอกข้อความ
        function copyToClipboard() {
            const scriptText = document.getElementById('outputScript');
            if(!scriptText.value) return;
            scriptText.select();
            document.execCommand('copy');
            alert('คัดลอกบทพูดเรียบร้อยแล้ว!');
        }

        // เรียบเรียงบทพูดจากข้อมูลสินค้า 100%
        function generateScript() {
            const name = document.getElementById('productName').value.trim();
            const details = document.getElementById('productDetails').value.trim();
            const outputScript = document.getElementById('outputScript');
            const loading = document.getElementById('loading');

            if (!name || !details) {
                alert('กรุณากรอกชื่อสินค้าและรายละเอียดให้ครบถ้วนก่อนครับ');
                return;
            }

            loading.classList.remove('hidden');
            outputScript.value = '';

            // จำลองเวลาประมวลผล 0.5 วินาทีเพื่อให้ดูเป็นธรรมชาติ
            setTimeout(() => {
                // แปลงรายละเอียดเป็นบทพูดขายของแบบทรงพลัง ดึงข้อมูลครบ 100%
                const generatedText = `🔥 คลิปรีวิวขายของสุดปัง: ${name} 🔥\n\n` +
                    `[เปิดคลิป - Hook ดึงดูดสายตา]\n` +
                    `"ทุกคนครับ! ใครกำลังมองหา ${name} ตัวนี้อยู่ บอกเลยว่าห้ามพลาดคลิปนี้เด็ดขาด!"\n\n` +
                    `[ช่วงนำเสนอจุดเด่น & ข้อมูลสินค้าแบบ 100%]\n` +
                    `"เพราะว่าตัวนี้อัดแน่นไปด้วยจุดเด่นแบบจัดเต็ม ไม่ว่าจะเป็น:\n` +
                    `${details.split('\n').map(item => `👉 ${item}`).join('\n')}\n\n` +
                    `เรียกว่าตอบโจทย์การใช้งานแบบสุดๆ สเปกครบ ครอบคลุมทุกการใช้งานจริง ของมันต้องมีติดบ้านไว้เลยครับ!"\n\n` +
                    `[ปิดท้าย - Call to Action]\n` +
                    `"ใครที่สนใจ ${name} สามารถกดสั่งซื้อที่ลิงก์ตะกร้าซ้ายล่าง หรือดุมารีวิวเพิ่มเติมได้เลย ช้าหมดอดนะ!"`;

                outputScript.value = generatedText;
                loading.classList.add('hidden');
            }, 500);
        }
    </script>
</body>
</html>
